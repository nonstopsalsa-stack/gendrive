<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Testing Dual Resume Memo</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Gendrive Dual Resume Memo Test Runner</h1>
  <div id="test-output"></div>

  <!-- Modal Container extracted from index.html -->
  <div class="modal-overlay hidden" id="modal-resume-note">
    <div class="modal-content resume-note-modal-dialog" id="resume-note-dialog">
      <!-- 単独表示用ヘッダー -->
      <div class="modal-header" id="resume-note-single-header">
        <div class="modal-title-group">
          <h3 id="resume-note-modal-title">📝 再開メモの記録 (中断)</h3>
          <span class="resume-note-task-badge" id="resume-note-task-name">タスク</span>
        </div>
        <button type="button" class="btn-modal-close" onclick="handleSaveResumeNote()" title="保存して閉じる (ESC / Enter)">✕</button>
      </div>

      <!-- デュアル表示用ヘッダー -->
      <div class="modal-header hidden" id="resume-note-dual-header">
        <div class="modal-title-group">
          <h3 id="resume-note-dual-title">🔄 タスク切り替え & 再開メモ連携</h3>
          <span class="resume-note-dual-subtitle">中断タスクの手がかりを記録し、再開タスクのメモを確認</span>
        </div>
        <button type="button" class="btn-modal-close" onclick="handleSaveResumeNote()" title="保存して作業開始 (ESC / Enter)">✕</button>
      </div>

      <div class="modal-body">
        <!-- 単独モード用パネル -->
        <div id="resume-note-single-body">
          <!-- Input Panel (中断時の白紙メモ入力) -->
          <div id="resume-note-input-panel">
            <textarea id="resume-note-textarea" class="resume-note-textarea" rows="3" placeholder="次に再開するときの手がかり・状況をメモ... (Enterで即保存)"></textarea>
            <div class="resume-note-tips">
              <span>💡 <b>Enter</b> または <b>ESC</b> で素早く保存して閉じられます</span>
            </div>
          </div>
          <!-- View Panel (再開時の前回のメモ確認) -->
          <div id="resume-note-view-panel" class="hidden">
            <div class="resume-note-view-box">
              <div class="resume-note-view-label">前回の作業メモ:</div>
              <div class="resume-note-view-content" id="resume-note-view-content"></div>
            </div>
          </div>
        </div>

        <!-- デュアルモード用パネル (左右並列表示) -->
        <div id="resume-note-dual-body" class="resume-note-dual-grid hidden">
          <!-- 左側：中断タスク（白紙メモ入力待ち） -->
          <div class="resume-note-dual-col resume-note-col-pause">
            <div class="resume-note-col-header">
              <span class="resume-note-col-badge pause-badge">⏸️ これから中断するタスク</span>
              <div class="resume-note-col-task-name" id="resume-note-dual-pause-task-name">タスクA</div>
            </div>
            <div class="resume-note-col-content">
              <div class="resume-note-col-label">📝 次への手がかり (白紙メモ):</div>
              <textarea id="resume-note-dual-textarea" class="resume-note-textarea resume-note-dual-textarea" rows="4" placeholder="次に再開するときの手がかり・状況をメモ... (Enterで即保存)"></textarea>
              <div class="resume-note-tips">
                <span>💡 <b>Enter</b> または <b>ESC</b> で保存して即開始</span>
              </div>
            </div>
          </div>

          <!-- 右側：再開タスク（記入済みメモ確認） -->
          <div class="resume-note-dual-col resume-note-col-resume">
            <div class="resume-note-col-header">
              <span class="resume-note-col-badge resume-badge">▶️ 今から再開するタスク</span>
              <div class="resume-note-dual-resume-task-name" id="resume-note-dual-resume-task-name">タスクB</div>
            </div>
            <div class="resume-note-col-content">
              <div class="resume-note-col-label">📋 前回中断時のメモ (確認):</div>
              <div class="resume-note-view-box resume-note-dual-view-box">
                <div class="resume-note-view-content" id="resume-note-dual-view-content"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-footer resume-note-footer">
        <button type="button" class="btn-subtle" onclick="closeResumeNoteModal()">閉じる</button>
        <button type="button" class="btn-primary" id="btn-resume-note-save" onclick="handleSaveResumeNote()">💾 保存して閉じる (Enter)</button>
        <button type="button" class="btn-primary" id="btn-resume-note-confirm" onclick="closeResumeNoteModal()">🚀 作業を開始する (Enter)</button>
        <button type="button" class="btn-primary hidden" id="btn-resume-note-dual-action" onclick="handleSaveResumeNote()">🚀 中断メモを保存して作業開始 (Enter)</button>
      </div>
    </div>
  </div>

  <!-- Modal Container for Task Presets -->
  <div class="modal-overlay" id="modal-task-presets"></div>

  <script>
    // State mock
    const state = {
      activeTaskId: null,
      currentSection: '第2セッション',
      tasks: [
        { id: 'task-1', title: '動画素材のカット割り編集', status: 'uncompleted', resumeNote: '' },
        { id: 'task-2', title: 'テロップ装飾とアニメーション付与', status: 'paused', resumeNote: '3分20秒までテロップ入れ完了。次はBGM選定から' },
        { id: 'task-3', title: 'サムネイル画像作成', status: 'uncompleted', resumeNote: '' }
      ],
      habits: [],
      taskPresets: [
        { id: 'preset-1', title: '緊急の修正対応', icon: '🚨', section: 'current', estMin: 15, tags: ['urgent'] },
        { id: 'preset-2', title: '突発クライアントMTG', icon: '📞', section: 'current', estMin: 30, tags: ['mtg'] }
      ]
    };

    let saveTasksCalled = 0;
    let renderAppCalled = 0;

    function saveTasks() { saveTasksCalled++; }
    function renderApp() { renderAppCalled++; }
    function getSelectedDateKey() { return '2026-09-07'; }
    function pushUndoAction() {}
    function loadTaskPresets() { return state.taskPresets; }
    function normalizeTags(t) { return Array.isArray(t) ? t : []; }
    function detectCurrentSection() { return '第2セッション'; }
    function saveTaskPresets() {}
    function showPresetListView() {}
    function closeModal() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }
  </script>

  <script src="../js/services/resumeNoteService.js"></script>
  <script src="../js/services/taskTimerService.js"></script>
  <script src="../js/components/taskPresetsService.js"></script>

  <script>
    const results = [];
    function assert(condition, message) {
      if (!condition) {
        results.push({ pass: false, message });
        console.error("FAIL: " + message);
      } else {
        results.push({ pass: true, message });
        console.log("PASS: " + message);
      }
    }

    try {
      console.log("=== Starting Gendrive Dual Resume Memo Test Suite ===");

      // Test 1: 手動中断 (pauseTask) -> 単独入力モーダル
      const t1 = state.tasks[0];
      t1.status = 'in_progress';
      state.activeTaskId = t1.id;
      pauseTask(t1.id);

      assert(currentResumeMode === 'input', 'Test 1.1: currentResumeMode should be input on manual pause');
      assert(!document.getElementById('resume-note-dialog').classList.contains('dual-mode'), 'Test 1.2: Dialog should NOT have dual-mode in single input');
      assert(!document.getElementById('resume-note-single-header').classList.contains('hidden'), 'Test 1.3: Single header visible');
      assert(document.getElementById('resume-note-dual-header').classList.contains('hidden'), 'Test 1.4: Dual header hidden');
      assert(!document.getElementById('resume-note-input-panel').classList.contains('hidden'), 'Test 1.5: Input panel visible');
      
      // テキスト入力して保存
      document.getElementById('resume-note-textarea').value = 'Test 1 Interrupt note';
      handleSaveResumeNote();
      assert(t1.resumeNote === 'Test 1 Interrupt note', 'Test 1.6: Task 1 resumeNote saved correctly');
      assert(currentResumeMode === null, 'Test 1.7: currentResumeMode reset after save');
      assert(document.getElementById('modal-resume-note').classList.contains('hidden'), 'Test 1.8: Modal hidden after save');

      // Test 2: 実行中タスクなしでメモ付きタスク再開 (startTask) -> 単独閲覧モーダル
      state.activeTaskId = null;
      const t2 = state.tasks[1]; // has resumeNote
      t2.status = 'paused';
      startTask(t2.id);

      assert(currentResumeMode === 'view', 'Test 2.1: currentResumeMode should be view on single resume');
      assert(!document.getElementById('resume-note-dialog').classList.contains('dual-mode'), 'Test 2.2: Dialog should NOT have dual-mode in single view');
      assert(document.getElementById('resume-note-view-content').textContent.includes('3分20秒までテロップ入れ完了'), 'Test 2.3: Existing note content rendered');
      assert(!document.getElementById('btn-resume-note-confirm').classList.contains('hidden'), 'Test 2.4: Confirm button visible');
      
      closeResumeNoteModal();
      assert(currentResumeMode === null, 'Test 2.5: currentResumeMode reset after close');
      assert(document.getElementById('modal-resume-note').classList.contains('hidden'), 'Test 2.6: Modal hidden after close');

      // Test 3: 実行中タスクあり(t2)で、メモなしタスク(t3)を開始 -> 自動中断で単独入力モーダル
      const t3 = state.tasks[2];
      t2.status = 'in_progress';
      state.activeTaskId = t2.id;
      startTask(t3.id);

      assert(t2.status === 'paused', 'Test 3.1: Task 2 auto-paused');
      assert(currentResumeMode === 'input', 'Test 3.2: currentResumeMode should be input for auto-pause');
      assert(!document.getElementById('resume-note-dialog').classList.contains('dual-mode'), 'Test 3.3: Dialog should NOT have dual-mode');
      closeResumeNoteModal();

      // Test 4: 【コア機能】実行中タスクあり(t3)で、メモ付きタスク(t2)を再開 -> デュアル並列モーダル起動！
      t3.status = 'in_progress';
      state.activeTaskId = t3.id;
      t2.status = 'paused';
      t2.resumeNote = '3分20秒までテロップ入れ完了。次はBGM選定から';

      startTask(t2.id);

      assert(t3.status === 'paused', 'Test 4.1: Task 3 auto-paused');
      assert(t2.status === 'in_progress', 'Test 4.2: Task 2 becomes in_progress');
      assert(currentResumeMode === 'dual', 'Test 4.3: currentResumeMode must be dual');
      assert(currentResumeModalTaskId === 'task-3', 'Test 4.4: Modal taskId is auto-paused task-3');
      assert(currentResumeViewTaskId === 'task-2', 'Test 4.5: View taskId is resuming task-2');

      const dialog = document.getElementById('resume-note-dialog');
      assert(dialog.classList.contains('dual-mode'), 'Test 4.6: Dialog has dual-mode class');
      assert(document.getElementById('resume-note-single-header').classList.contains('hidden'), 'Test 4.7: Single header is hidden');
      assert(!document.getElementById('resume-note-dual-header').classList.contains('hidden'), 'Test 4.8: Dual header is visible');
      assert(!document.getElementById('resume-note-dual-body').classList.contains('hidden'), 'Test 4.9: Dual body is visible');
      assert(!document.getElementById('btn-resume-note-dual-action').classList.contains('hidden'), 'Test 4.10: Dual action button visible');

      // 左右カラムの内容検証
      const pauseTaskName = document.getElementById('resume-note-dual-pause-task-name').textContent;
      const resumeTaskName = document.getElementById('resume-note-dual-resume-task-name').textContent;
      const dualTextarea = document.getElementById('resume-note-dual-textarea');
      const dualViewContent = document.getElementById('resume-note-dual-view-content').textContent;

      assert(pauseTaskName === t3.title, 'Test 4.11: Left column has paused task name (Task 3)');
      assert(resumeTaskName === t2.title, 'Test 4.12: Right column has resuming task name (Task 2)');
      assert(dualTextarea.value === '', 'Test 4.13: Left column textarea is reset to blank for new note');
      assert(dualViewContent.includes('3分20秒までテロップ入れ完了'), 'Test 4.14: Right column shows existing note for Task 2');

      // Test 5: デュアルモードで左の白紙メモに入力して保存
      dualTextarea.value = 'サムネイル構図A案作成済、次は配色';
      handleSaveResumeNote();

      assert(t3.resumeNote === 'サムネイル構図A案作成済、次は配色', 'Test 5.1: Task 3 saved newly entered resume note');
      assert(t2.resumeNote === '3分20秒までテロップ入れ完了。次はBGM選定から', 'Test 5.2: Task 2 existing note preserved intact');
      assert(currentResumeMode === null, 'Test 5.3: Mode reset after dual save');
      assert(!dialog.classList.contains('dual-mode'), 'Test 5.4: dual-mode class removed from dialog');
      assert(document.getElementById('modal-resume-note').classList.contains('hidden'), 'Test 5.5: Modal hidden after dual save');

      // Test 6: デュアルモードで空のまま保存した場合
      t2.status = 'in_progress';
      state.activeTaskId = t2.id;
      t3.status = 'paused';
      // t3 already has note, start t3 again
      startTask(t3.id); // t2 is auto-paused, t3 is resumed with note
      assert(currentResumeMode === 'dual', 'Test 6.1: Dual mode re-triggered');
      // don't enter anything in dualTextarea
      handleSaveResumeNote();
      assert(t2.resumeNote === '', 'Test 6.2: Task 2 has empty resumeNote when saved blank');
      assert(t3.resumeNote === 'サムネイル構図A案作成済、次は配色', 'Test 6.3: Task 3 note preserved');

      // Test 7: タスク完了時のクリア
      completeTask(t3.id);
      assert(t3.resumeNote === '', 'Test 7.1: Task 3 resumeNote cleared upon completion');

      // Test 8: プリセットタスク実行（緊急割り込み）時の再開メモ動作検証
      // 8.1: 実行中タスク(t2)がある状態でプリセットタスク起動 -> プリセットモーダルのみ閉じ、中断メモモーダルが安全に開く
      t2.status = 'in_progress';
      state.activeTaskId = t2.id;
      const presetModal = document.getElementById('modal-task-presets');
      presetModal.classList.add('active');

      executePresetTask('preset-1');

      assert(!presetModal.classList.contains('active'), 'Test 8.1: Preset modal is closed');
      assert(t2.status === 'paused', 'Test 8.2: Prior task t2 is auto-paused');
      assert(currentResumeMode === 'input', 'Test 8.3: currentResumeMode is input for prior task');
      assert(document.getElementById('modal-resume-note').classList.contains('active'), 'Test 8.4: Resume note modal is ACTIVE (not erroneously closed by closeModal)');
      assert(!document.getElementById('modal-resume-note').classList.contains('hidden'), 'Test 8.5: Resume note modal is NOT hidden');

      // 中断メモを打鍵して保存
      document.getElementById('resume-note-textarea').value = 'BGMの選定まで完了、緊急対応後に音量調整';
      handleSaveResumeNote();

      assert(t2.resumeNote === 'BGMの選定まで完了、緊急対応後に音量調整', 'Test 8.6: Prior task t2 saved resume note successfully');
      assert(document.getElementById('modal-resume-note').classList.contains('hidden'), 'Test 8.7: Resume note modal closed after save');
      const newlyCreatedTask = state.tasks[state.tasks.length - 1];
      assert(newlyCreatedTask.status === 'in_progress', 'Test 8.8: Newly created preset task is now in_progress');

      // 8.2: 実行中タスクがない（アイドル状態）でプリセットタスク起動 -> 中断メモモーダルは開かず即座に開始
      state.tasks.forEach(t => { if (t.status === 'in_progress') t.status = 'paused'; });
      state.activeTaskId = null;
      presetModal.classList.add('active');

      executePresetTask('preset-2');

      assert(!presetModal.classList.contains('active'), 'Test 8.9: Preset modal is closed on idle start');
      assert(document.getElementById('modal-resume-note').classList.contains('hidden'), 'Test 8.10: Resume note modal is NOT opened on idle start');
      const idlePresetTask = state.tasks.find(t => t.id === state.activeTaskId);
      assert(idlePresetTask && idlePresetTask.status === 'in_progress', 'Test 8.11: Idle preset task starts in_progress immediately');

      // 8.3: プリセットタスク実行中に、さらに別のプリセットタスクを起動（割り込みの入れ子）
      presetModal.classList.add('active');
      executePresetTask('preset-1');

      assert(idlePresetTask.status === 'paused', 'Test 8.12: Prior preset task is auto-paused on nested preset start');
      assert(currentResumeMode === 'input', 'Test 8.13: Nested preset triggers input mode for prior preset task');
      assert(document.getElementById('modal-resume-note').classList.contains('active'), 'Test 8.14: Resume note modal is ACTIVE on nested preset');
      document.getElementById('resume-note-textarea').value = 'MTG議事録作成中、後で共有';
      handleSaveResumeNote();
      assert(idlePresetTask.resumeNote === 'MTG議事録作成中、後で共有', 'Test 8.15: Prior preset task saved resume note');
      const nestedPresetTask = state.tasks.find(t => t.id === state.activeTaskId);
      assert(nestedPresetTask && nestedPresetTask.status === 'in_progress', 'Test 8.16: Nested preset task is in_progress');

    } catch (err) {
      assert(false, 'Unexpected exception during tests: ' + err.message + '\n' + err.stack);
    }

    const failed = results.filter(r => !r.pass);
    const allPassed = failed.length === 0;
    const summaryText = allPassed ? "ALL_TESTS_PASSED (" + results.length + " tests)" : "FAILED (" + failed.length + " tests)";
    document.title = summaryText;

    const outDiv = document.getElementById('test-output');
    if (outDiv) {
      outDiv.innerHTML = '<h2>' + summaryText + '</h2>' +
        '<ul>' + results.map(r => '<li style="color:' + (r.pass ? 'green' : 'red') + '">' + (r.pass ? 'PASS: ' : 'FAIL: ') + r.message + '</li>').join('') + '</ul>';
    }

    window.__TEST_SUMMARY__ = {
      allPassed: allPassed,
      total: results.length,
      passed: results.filter(r => r.pass).length,
      failed: failed.length,
      results: results
    };
  </script>
</body>
</html>
